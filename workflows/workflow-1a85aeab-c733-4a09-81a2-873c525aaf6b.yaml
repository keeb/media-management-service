id: 1a85aeab-c733-4a09-81a2-873c525aaf6b
name: media-cleaner
description: Clean completed torrents from Transmission
jobs:
  - name: main
    description: Remove completed torrents
    steps:
      - name: activate-venv
        description: Activate Python virtual environment if it exists
        task:
          type: shell
          command: bash
          args:
            - -c
            - "[ -d .venv ] && source .venv/bin/activate"
        dependsOn: []
        weight: 0
      - name: run-cleaner
        description: Run media-cleaner to remove completed torrents
        task:
          type: shell
          command: bash
          args:
            - -c
            - "source .venv/bin/activate && media-cleaner"
        dependsOn:
          - step: activate-venv
            condition:
              type: always
        weight: 0
    dependsOn: []
    weight: 0
version: 1
