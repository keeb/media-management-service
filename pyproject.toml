[project]
name = "mediaservice"
version = "0.1.0"
description = "Media management and automation tools"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.6.0",
    "requests>=2.32.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "pyyaml>=6.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
mms = "mediaservice.cli.main:cli"
# Legacy entry points (deprecated, use mms subcommands instead)
media-cleaner = "mediaservice.cli.cleaner:main"
media-worker = "mediaservice.cli.media_worker:main"
subsplease-dl = "mediaservice.cli.subsplease_dl:main"
sg-worker = "mediaservice.cli.sg_worker:main"
sg-scrape = "mediaservice.cli.sg_scrape:main"
media-indexer = "mediaservice.cli.indexer:main"
erai-raws-dl = "mediaservice.cli.erai_raws_dl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/src/mediaservice"]

[tool.hatch.build.targets.editable]
sources = ["python/src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
